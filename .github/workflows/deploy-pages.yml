name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static dashboard
        env:
          # Supabase publishable keys are designed for browser clients; RLS protects user data.
          VITE_SUPABASE_URL: https://logkdsuqbachhueraqjm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_DxDoKrfMEg44KVTAKX9Q6Q_zbx9aXhz
        run: pnpm exec vite build --config vite.pages.config.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
