name: Diagnose structured news search

on:
  push:
    paths:
      - .github/workflows/diagnose-news-json.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JSON and source evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.openai.com/v1/responses', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + process.env.OPENAI_API_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'gpt-4.1',
              tools: [{ type: 'web_search', search_context_size: 'high' }],
              tool_choice: 'required',
              max_tool_calls: 4,
              include: ['web_search_call.results'],
              text: { format: { type: 'json_object' } },
              input: 'Use live web search. Return only a JSON object {"items":[{"title":"...","url":"https://original-publisher-article","publishedDate":"2026-10-22"}]} with up to 6 distinct real important reports published from 2026-10-21 08:00 to 2026-10-22 07:50 Beijing time. Prefer Reuters, AP, Xinhua, BBC, Al Jazeera, Financial Times. Original source URL only. Do not invent.',
              max_output_tokens: 5000
            })
          });
          const body = await response.json();
          console.log('API:', response.status, 'status:', body.status, 'error:', body.error?.message?.slice(0, 200) ?? 'none');
          const calls = (body.output ?? []).filter(x => x.type === 'web_search_call');
          console.log('Search calls:', calls.length, 'result counts:', calls.map(x => x.results?.length ?? -1).join(','));
          const evidence = new Set(calls.flatMap(x => x.results ?? []).map(x => x.url).filter(Boolean));
          console.log('Evidence URLs:', [...evidence].slice(0, 8).join(' | '));
          const message = (body.output ?? []).filter(x => x.type === 'message').flatMap(x => x.content ?? []);
          const output = message.filter(x => x.type === 'output_text').map(x => x.text).join('\n');
          console.log('Output length:', output.length, 'citations:', message.flatMap(x => x.annotations ?? []).length);
          try {
            const data = JSON.parse(output);
            console.log('Parsed items:', data.items?.length ?? -1);
            for (const item of (data.items ?? []).slice(0, 6)) console.log('Candidate:', item.publishedDate, item.url);
          } catch (e) { console.log('Parse failed:', output.slice(0, 300)); }
          if (!response.ok) throw new Error('OpenAI request failed');
          NODE
