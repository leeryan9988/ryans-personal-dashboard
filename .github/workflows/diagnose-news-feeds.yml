name: Diagnose publisher feeds

on:
  push:
    paths:
      - .github/workflows/diagnose-news-feeds.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test publisher feeds
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const feeds = [
            'https://feeds.bbci.co.uk/news/world/rss.xml',
            'https://feeds.bbci.co.uk/news/business/rss.xml',
            'https://www.theguardian.com/world/rss',
            'https://www.theguardian.com/business/rss',
            'https://www.aljazeera.com/xml/rss/all.xml',
            'https://www.france24.com/en/rss',
            'https://feeds.npr.org/1001/rss.xml',
            'https://www.lemonde.fr/en/international/rss_full.xml',
            'https://www.lemonde.fr/en/economy/rss_full.xml',
            'https://www.abc.net.au/news/feed/51120/rss.xml',
          ];
          for (const url of feeds) {
            try {
              const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const body = await r.text();
              console.log(new URL(url).hostname, r.status, 'items:', (body.match(/<item[ >]/g) ?? []).length, 'len:', body.length, 'dates:', [...body.matchAll(/<pubDate>([^<]+)/g)].slice(0, 2).map(x => x[1]).join(' | '));
            } catch (e) { console.log(new URL(url).hostname, e.name); }
          }
          NODE
