name: Diagnose OpenAI briefing quota

on:
  push:
    paths:
      - .github/workflows/diagnose-openai-quota.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check a tiny structured response
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const r = await fetch('https://api.openai.com/v1/responses', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + process.env.OPENAI_API_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: 'gpt-4.1', text: { format: { type: 'json_object' } }, input: 'Return a JSON object with ok true.', max_output_tokens: 100 })
          });
          const body = await r.json();
          console.log('HTTP:', r.status, 'error type:', body.error?.type ?? 'none', 'code:', body.error?.code ?? 'none', 'message:', body.error?.message?.slice(0, 500) ?? 'none');
          console.log('Rate remaining:', r.headers.get('x-ratelimit-remaining-requests') ?? 'unknown', 'reset:', r.headers.get('x-ratelimit-reset-requests') ?? 'unknown');
          NODE
