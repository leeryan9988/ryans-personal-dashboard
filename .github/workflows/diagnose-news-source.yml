name: Diagnose cloud news source intake

on:
  push:
    paths:
      - .github/workflows/diagnose-news-source.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect one model response and source access without publishing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.openai.com/v1/responses', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + process.env.OPENAI_API_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'gpt-4.1',
              tools: [{ type: 'web_search', search_context_size: 'medium' }],
              tool_choice: 'required',
              max_tool_calls: 2,
              input: 'Find 3 different important news stories published on 2026-10-21 or 2026-10-22 by AP, Reuters, BBC, Xinhua, or Al Jazeera. Return only JSON object with items array; each item needs title, original publisher article URL, publishedDate in Beijing time. Do not invent links.',
              max_output_tokens: 1600
            })
          });
          const body = await response.json();
          console.log('API status:', response.status, 'output item types:', (body.output ?? []).map(x => x.type).join(','), 'error type:', body.error?.type ?? 'none');
          const output = (body.output ?? []).filter(x => x.type === 'message').flatMap(x => x.content ?? []).filter(x => x.type === 'output_text').map(x => x.text).join('\n');
          console.log('Output length:', output.length, 'prefix:', output.slice(0, 900));
          const urls = [...output.matchAll(/https:\/\/[^\s"'<>\\]+/g)].map(x => x[0].replace(/[),;.]+$/, '')).slice(0, 4);
          for (const url of urls) {
            try {
              const page = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' }, signal: AbortSignal.timeout(10000) });
              console.log('Source status:', page.status, new URL(url).hostname, 'final host:', new URL(page.url).hostname);
            } catch (e) { console.log('Source failure:', new URL(url).hostname, e.name); }
          }
          if (!response.ok) throw new Error('API request failed');
          NODE
