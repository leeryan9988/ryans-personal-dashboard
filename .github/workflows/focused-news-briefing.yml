name: Publish focused AI economy trade news

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/focused-news-briefing.yml
      - scripts/focus-news-digest.mjs
  schedule:
    # UTC; 06:35, 06:45, 06:55 and 07:10 Beijing time.
    - cron: '35 22 * * *'
    - cron: '45 22 * * *'
    - cron: '55 22 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: focused-news-briefing
  cancel-in-progress: false

jobs:
  focused_news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect official source leads and rule-based observations
        run: node scripts/focus-news-digest.mjs
      - name: Translate new issue when the no-key translation service is available
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain public/focus-news)" ]]; then
            echo "No new issue"
            exit 0
          fi
          report="public/focus-news/$(TZ=Asia/Shanghai date +%F).json"
          if ! python scripts/translate-news-titles.py "$report"; then
            echo "::warning::Title translation unavailable; preserving original titles."
          fi
          if ! python scripts/enrich-news-context.py "$report"; then
            echo "::warning::Summary translation unavailable; preserving publisher leads."
          fi
      - name: Commit the new dated issue
        id: commit
        shell: bash
        run: |
          git add public/focus-news
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'news: publish AI economy trade briefing'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main:refs/remotes/origin/main
            report="public/focus-news/$(TZ=Asia/Shanghai date +%F).json"
            if git cat-file -e "origin/main:$report" 2>/dev/null; then
              echo "Today's issue already exists on main; refusing overwrite."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase --onto origin/main HEAD^ || { git rebase --abort; exit 1; }
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Could not push after three attempts." >&2
          exit 1
      - name: Deploy through the existing Pages workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
