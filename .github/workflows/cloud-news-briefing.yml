name: Publish global news from official feeds

on:
  schedule:
    # GitHub cron is UTC; check feeds at 07:00, then publish after the 07:50 Beijing cutoff.
    - cron: '0 23 * * *'
    - cron: '50 23 * * *'
    - cron: '55 23 * * *'
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check feed coverage without publishing, or publish a new date
        required: true
        type: choice
        options:
          - check
          - publish

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-news-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '0 23 * * *' && 'check' || 'publish' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect distinct reports from official publisher feeds
        run: node scripts/cloud-news-feed-only.mjs "$MODE"
      - name: Translate new headlines into Chinese
        if: env.MODE == 'publish'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain public/news)" ]]; then
            echo "No new briefing to translate"
            exit 0
          fi
          python scripts/translate-news-titles.py "public/news/$(TZ=Asia/Shanghai date +%F).json"
      - name: Commit only a new dated briefing
        if: env.MODE == 'publish'
        id: commit
        shell: bash
        run: |
          git add public/news
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'news: publish official-feed briefing'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start the existing Pages deployment
        if: env.MODE == 'publish' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

