name: Test free headline translation
on:
  push:
    branches:
      - news-regenerate-2026-10-22
  workflow_dispatch:
permissions:
  contents: read
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public translation endpoint on three sample headlines
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          titles = ["The 'trillion pound' oil fund the government believes Britain could have built", "Nigeria’s first Ebola case matches DR Congo strain, health officials say", "Walmart unveils tools allowing AI agents to shop for customers"]
          for title in titles:
              query = urllib.parse.urlencode({"client":"gtx","sl":"en","tl":"zh-CN","dt":"t","q":title})
              request = urllib.request.Request("https://translate.googleapis.com/translate_a/single?"+query, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  data=json.load(response)
              print(title, "=>", "".join(part[0] for part in data[0]))
          PY
