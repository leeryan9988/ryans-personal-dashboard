name: Publish global news from official feeds

on:
  schedule:
    # GitHub cron is UTC; check feeds at 07:00, then publish after the 07:50 Beijing cutoff.
    - cron: '0 23 * * *'
    - cron: '50 23 * * *'
    - cron: '55 23 * * *'
    - cron: '10 0 * * *'
  push:
    paths:
      - '.github/workflows/cloud-news-briefing.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Check feeds, publish a new date, or enrich an existing date
        required: true
        type: choice
        options:
          - check
          - publish
          - enrich
      date:
        description: Existing briefing date for manual enrichment (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-news-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODE: ${{ github.event_name == 'push' && 'enrich' || github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '0 23 * * *' && 'check' || 'publish' }}
      TARGET_DATE: ${{ github.event_name == 'push' && '2026-10-22' || inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect distinct reports from official publisher feeds
        if: env.MODE != 'enrich'
        run: node scripts/cloud-news-feed-only.mjs "$MODE"
      - name: Translate new headlines into Chinese
        if: env.MODE == 'publish'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain public/news)" ]]; then
            echo "No new briefing to translate"
            exit 0
          fi
          python scripts/translate-news-titles.py "public/news/$(TZ=Asia/Shanghai date +%F).json"
      - name: Add source-based Chinese context
        if: env.MODE == 'publish' || env.MODE == 'enrich'
        shell: bash
        run: |
          if [[ "$MODE" == publish && -z "$(git status --porcelain public/news)" ]]; then
            echo "No new briefing to enrich"
            exit 0
          fi
          if [[ "$MODE" == enrich ]]; then
            [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Provide a valid date"; exit 1; }
            report="public/news/$TARGET_DATE.json"
          else
            report="public/news/$(TZ=Asia/Shanghai date +%F).json"
          fi
          test -f "$report"
          python scripts/enrich-news-context.py "$report"
      - name: Commit enriched briefing
        if: env.MODE == 'publish' || env.MODE == 'enrich'
        id: commit
        shell: bash
        run: |
          git add public/news
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'news: publish source-based briefing context'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Start the existing Pages deployment
        if: (env.MODE == 'publish' || env.MODE == 'enrich') && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

