name: Publish global news from official feeds

on:
  schedule:
    # GitHub cron is UTC; these are 07:50, 07:55 and 08:10 Beijing time.
    - cron: '50 23 * * *'
    - cron: '55 23 * * *'
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check feed coverage without publishing, or publish a new date
        required: true
        type: choice
        options:
          - check
          - publish

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-news-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect distinct reports from official publisher feeds
        run: node scripts/cloud-news-feed-only.mjs "$MODE"
      - name: Export experimental news without publishing
        if: env.MODE == 'publish'
        shell: bash
        run: |
          printf 'REPORT_BASE64='; base64 -w 0 public/news/2026-10-22.json; printf '\n'
          printf 'INDEX_BASE64='; base64 -w 0 public/news/index.json; printf '\n'
