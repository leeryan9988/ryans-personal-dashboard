name: Test offline Chinese news headlines

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Test translation without publishing
        required: true
        type: choice
        options:
          - check
          - publish

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation package
        run: python -m pip install --disable-pip-version-check argostranslate==1.11.0
      - name: Translate today's existing headlines
        run: python scripts/translate-news-titles.py public/news/2026-10-22.json
      - name: Export translated report for review without publishing
        run: |
          printf 'REPORT_BASE64='; base64 -w 0 public/news/2026-10-22.json; printf '\n'
